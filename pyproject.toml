[project]
name = "ledgerlens"
version = "0.1.0"
description = "Multimodal agentic accounts-payable platform for Indian GST invoices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    # Async & concurrency
    "anyio>=4.5.0",
    "tenacity>=8.3.0",
    # Database
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    # FastAPI
    "fastapi>=0.112.0",
    "uvicorn>=0.30.6",
    "email-validator>=2.2.0",
    # LangGraph & LangChain
    "langgraph>=0.2.34",
    "langchain-core>=0.3.25",
    "langchain-openai>=0.2.1",
    # MCP
    "mcp>=1.0.0",
    # Vector store
    "qdrant-client>=1.11.0",
    # OCR / Document processing
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=10.4.0",
    "weasyprint>=62.0",
    # Evaluation & testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "rapidfuzz>=3.9.0",
    # Observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    # Utilities
    "pyyaml>=6.0.1",
    "orjson>=3.10.0",
    "xxhash>=3.5.0",
    "tqdm>=4.66.5",
    "filelock>=3.15.0",
    "opentelemetry-exporter-prometheus>=0.66b2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.384",
    "pre-commit>=3.8.0",
    "mypy>=1.11.0",
    "pytest-mock>=3.14.0",
]
full = [
    "paddleocr>=2.8.1",
    "streamlit>=1.38.0",
    "plotly>=5.23.0",
    "kaleido>=0.2.1",
    "locust>=2.32.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "pyright>=1.1.384",
    "pre-commit>=3.8.0",
    "mypy>=1.11.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle
    "TRY", # tryceratops
    "TID", # flake8-tidy-imports
]
ignore = [
    "D100",  # missing docstring (we'll add as we go)
    "D101",  # missing docstring in class
    "D102",  # missing docstring in method
    "D103",  # missing docstring in function
    "D104",  # missing docstring in package
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "S101",  # assert (used in tests)
    "ARG001", # unused argument (used in callbacks)
    "ARG002", # unused argument (used in callbacks)
]
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D107"] }
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pyright]
python-version = "3.12"
type-checking-mode = "basic"
report-missing-imports = true
report-missing-type-stubs = true
report-unknown-member-type = true
report-unknown-parameter-type = true
report-unknown-variable-type = true
report-unused-parameter = true
report-unused-variable = true

[tool.pytest.ini_options]
asyncio-mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude-lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
