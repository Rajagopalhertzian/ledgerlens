version: "3.9"

services:
  # Core profile services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerlens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - core
      - full

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - core
      - full

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=postgresql+asyncpg://ledgerlens:ledgerlens@postgres:5432/ledgerlens
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - CHEAP_MODEL=${CHEAP_MODEL}
      - STRONG_MODEL=${STRONG_MODEL}
      - JUDGE_MODEL=${JUDGE_MODEL}
      - VLM_MODEL=${VLM_MODEL}
      - MAX_SPEND_USD=${MAX_SPEND_USD:-10.0}
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - core
      - full

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://ledgerlens:ledgerlens@postgres:5432/ledgerlens
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - CHEAP_MODEL=${CHEAP_MODEL}
      - STRONG_MODEL=${STRONG_MODEL}
      - JUDGE_MODEL=${JUDGE_MODEL}
      - VLM_MODEL=${VLM_MODEL}
      - MAX_SPEND_USD=${MAX_SPEND_USD:-10.0}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    profiles:
      - core
      - full

  erp-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["erp"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://ledgerlens:ledgerlens@postgres:5432/ledgerlens
      - MCP_AUTH_TOKEN=${ERP_MCP_AUTH_TOKEN:-erp-mcp-secret}
      - LOG_LEVEL=INFO
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - core
      - full

  policy-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["policy"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MCP_AUTH_TOKEN=${POLICY_MCP_AUTH_TOKEN:-policy-mcp-secret}
      - LOG_LEVEL=INFO
    ports:
      - "8002:8000"
    depends_on:
      - qdrant
    profiles:
      - core
      - full

  comms-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["comms"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://ledgerlens:ledgerlens@postgres:5432/ledgerlens
      - MCP_AUTH_TOKEN=${COMMS_MCP_AUTH_TOKEN:-comms-mcp-secret}
      - LOG_LEVEL=INFO
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - core
      - full

  # Full profile additional services
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  observability:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data
    profiles:
      - full

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - API_BASE_URL=http://api:8000
      - LOG_LEVEL=INFO
    ports:
      - "8501:8501"
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
  qdrant_data:
  phoenix_data: