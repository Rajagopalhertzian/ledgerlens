# LedgerLens CI Pipeline
# Runs on every push and PR

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Prevent uv from prompting for input
  UV_NO_PROGRESS: 1
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run pyright
        run: uv run pyright src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerlens
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: ledgerlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ledgerlens -d ledgerlens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run pytest
        run: uv run pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://ledgerlens:ledgerlens@localhost:5432/ledgerlens
          REDIS_URL: redis://localhost:6379/0
          LLM_API_KEY: dummy-key-for-testing
          LLM_BASE_URL: https://api.openai.com/v1
          CHEAP_MODEL: gpt-4o-mini
          STRONG_MODEL: gpt-4o
          JUDGE_MODEL: gpt-4o
          VLM_MODEL: gpt-4o
          MAX_SPEND_USD: 1.0
          LOG_LEVEL: DEBUG

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: ledgerlens/api:test

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: ledgerlens/worker:test

      - name: Build MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          load: true
          tags: ledgerlens/mcp:test

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ui
          push: false
          load: true
          tags: ledgerlens/ui:test

  eval-smoke:
    name: Evaluation Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.labels.*.name == 'eval-smoke'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run smoke evaluation (cached responses only)
        run: |
          echo "Running smoke evaluation on cached responses..."
          # This will be implemented in M1+
          # uv run python -m evals.smoke
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MAX_SPEND_USD: 0.50

  gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run eval gate
        run: |
          echo "Running eval gate against baseline..."
          # uv run python -m evals.gate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MAX_SPEND_USD: ${{ vars.MAX_SPEND_USD || '5.0' }}